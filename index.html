<style>

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const st = JSON.parse(raw); try { mesclarBaseReal(st); } catch (e) { console.warn('Mesclagem da base falhou', e); } return normalizarEstado(st); }
  } catch (e) { console.warn('Falha ao ler dados salvos', e); }

}
let state = loadState();
let _ultimoBackupSalvo = 0, _saveAgendado = null;
function _lerBackupMeta() { try { return JSON.parse(localStorage.getItem(BACKUP_META_KEY) || '{}') || {}; } catch (e) { return {}; } }
function _gravarBackupMeta(meta) { try { localStorage.setItem(BACKUP_META_KEY, JSON.stringify(meta)); } catch (e) {} }
function fazerBackup() {
  try {
    const payload = JSON.stringify({ em: new Date().toISOString(), state });
    localStorage.setItem(BACKUP_KEY, payload);
    _ultimoBackupSalvo = Date.now();
    const meta = _lerBackupMeta();
    meta.ultimo = new Date().toISOString();
    meta.tamanho = payload.length;
    _gravarBackupMeta(meta);
    return true;
  } catch (e) {
    if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
      try { localStorage.removeItem(BACKUP_KEY); localStorage.setItem(BACKUP_KEY, JSON.stringify({ em: new Date().toISOString(), state })); return true; } catch (e2) { return false; }
    }
    return false;
  }
}

  state._atualizadoEm = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    const quota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
    if (quota) {
      toast('Armazenamento cheio. Exporte um backup e remova logos ou dados antigos.', 'error');
      try { fazerBackup(); } catch (e2) {}
    } else {
      toast('Não foi possível salvar no navegador', 'error');
    }
    return;
  }
  const agora = Date.now();

function restaurarBackup() {
  try {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) { toast('Nenhum backup automático encontrado', 'warn'); return false; }
    const obj = JSON.parse(raw);
    if (!obj || !obj.state) { toast('Backup inválido', 'error'); return false; }
    state = normalizarEstado(obj.state);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    render();
    toast('Backup de ' + fmtDataHora(obj.em) + ' restaurado');

  return ((diffDays(date, parseISO(anc.data)) % len) + len) % len;

// Camada opcional sobre a escala: em ciclos marcados "folga nos feriados" (expediente), o turno vira F.
// A âncora e a aritmética do ciclo não mudam.
function turno(eqId, date) {
  const p = posicao(eqId, date); if (p === null) return null;
  const ciclo = getCiclo(getEquipe(eqId).cicloId), t = ciclo.sequencia[p];

// Busca horário próprio da função (ciclo.horarios[t][idDaFuncao]); se não houver, usa o do Agente.
function horario(ciclo, t, funcao) { return ciclo?.horarios?.[t]?.[funcao] || ciclo?.horarios?.[t]?.agente || null; }

  let m = minutos(h[1]) - minutos(h[0]); if (m <= 0) m += 1440;
  m -= Number(ciclo?.horarios?.[t]?.pausaMin) || 0; // pausa não trabalhada (ex.: almoço do expediente)
  return Math.max(0, m) / 60;

// Horas noturnas: valem a partir das 22h e vão até o FIM da escala (não param às 05h).
// Ex.: 19h–07h = 9h; 18h–06h = 8h; 14h–02h = 4h; 07h–19h = 0h.
function horasNoturnasHorario(h) {

}

/* Emenda entre meses: o 1º plantão do mês deve vir logo após a folga
   que o ciclo prevê depois do último plantão do mês anterior. */
function verificarEmenda(eqId, ano, mes) {
  const eq = getEquipe(eqId); const ciclo = eq && getCiclo(eq.cicloId);
  if (!ciclo || !ciclo.sequencia.some(t => t !== 'F')) return null;
  if (ciclo.folgaNosFeriados) return null; // feriados quebram o padrão semanal: a conferência de emenda não se aplica
  const seq = ciclo.sequencia, len = seq.length;
  const inicio = new Date(ano, mes, 1);
  let ult = addDays(inicio, -1), k = 0;
  while (turno(eqId, ult) === 'F' && k < 120) { ult = addDays(ult, -1); k++; }
  let pri = new Date(inicio), j = 0;
  while (turno(eqId, pri) === 'F' && j < 120) { pri = addDays(pri, 1); j++; }
  if (k >= 120 || j >= 120) return null;
  const encontradas = diffDays(pri, ult) - 1;
  let i = (posicao(eqId, ult) + 1) % len, previstas = 0;
  while (seq[i] === 'F' && previstas < len) { previstas++; i = (i + 1) % len; }
  return { ok: encontradas === previstas, folgasEncontradas: encontradas, folgasPrevistas: previstas,
           ultimoPlantao: ult, primeiroPlantao: pri, turnoUltimo: turno(eqId, ult), turnoPrimeiro: turno(eqId, pri) };
}

function problemasEquipe(eqId, supsN, agsN) {
  const eq = getEquipe(eqId), p = [], s = supsN !== undefined ? supsN : supervisores(eqId).length, a = agsN !== undefined ? agsN : agentes(eqId).length;
  if (s === 0 && (!eq || eq.exigeSupervisor !== false)) p.push('sem supervisor');
  if (s > 1) p.push(`${s} supervisores`);
  const min = eq && eq.efetivoMinimo !== undefined ? eq.efetivoMinimo : 4;
  if (a < min) p.push(`${a} agente${a === 1 ? '' : 's'}`);
  return p;
}
function inconsistencias() {
  const lista = [];
  state.equipes.forEach(e => { const p = problemasEquipe(e.id); if (p.length) lista.push(`${e.nome}: ${p.join(', ')}.`); });
  const hoje = new Date(), grupos = {};
  state.equipes.forEach(e => { if (e.exigeSupervisor === false) return; const k = e.cicloId + '|' + posicao(e.id, hoje); (grupos[k] = grupos[k] || []).push(e.nome); });
  Object.values(grupos).forEach(n => { if (n.length > 1) lista.push(`${n.join(' e ')} estão na mesma posição do ciclo (sempre escaladas juntas).`); });
  state.trocasJornada.forEach(t => { if (!jornadaDeOrigemTJ(t)) lista.push(`Troca de jornada de ${nomeG(t.guardaId)} (${br(t.de)} → ${br(t.para)}): o plantão de origem não existe mais no ciclo.`); });
  const porNome = {}; state.guardas.forEach(g => { const k = norm(impresso(g)); (porNome[k] = porNome[k] || []).push(g); });
  Object.values(porNome).filter(l => l.length > 1).forEach(l => lista.push(`Nome impresso repetido: ${impresso(l[0])} (${l.map(g => g.nomeCompleto).join(' e ')}). No boletim não dá para saber quem é: ajuste o "Nome no edital" de um deles.`));
  const semEq = state.guardas.filter(g => !g.equipeId).length;
  if (semEq) lista.push(`${semEq} guarda${semEq > 1 ? 's' : ''} sem equipe.`);

}

/* ============================================================
   CALENDÁRIO MENSAL (segunda a domingo)
   ============================================================ */
function calendario(fnTurno, fnExtra, fnTroca) {
  const y = mesSel.getFullYear(), m = mesSel.getMonth(), n = diasNoMes(y, m);
  const off = (new Date(y, m, 1).getDay() + 6) % 7, hojeISO = iso(new Date());
  let h = `<div class="grid grid-cols-7 gap-1 text-center text-xs">${SEM_SEG.map(l => `<div class="font-bold text-slate-500 py-1">${l}</div>`).join('')}`;
  for (let i = 0; i < off; i++) h += '<div></div>';
  for (let i = 1; i <= n; i++) {
    const d = new Date(y, m, i), t = fnTurno(d), x = fnExtra ? fnExtra(d) : null, tr = fnTroca ? fnTroca(d) : null;
    h += `<div class="rounded-lg ${classeCodigo(t) || 'bg-slate-50'} ${x ? 'he-cell' : ''} ${tr ? 'tr-cell' : ''} min-h-[44px] flex flex-col items-center justify-center ${iso(d) === hojeISO ? 'ring-2 ring-teal-500' : ''}">
      <span class="font-medium">${i}</span>${t ? `<span class="text-[10px] font-bold">${t}</span>` : ''}${x ? `<span class="he-tag">${x}</span>` : ''}${tr ? `<span class="tr-tag">${tr}</span>` : ''}</div>`;
  }
  return h + '</div>';
}
function cardNum(valor, rotulo, cls = '') {
  return `<div class="${CARD} p-3 text-center"><div class="text-2xl font-bold ${cls}">${valor}</div><div class="text-xs text-slate-500 mt-1">${rotulo}</div></div>`;
}

      </select>
      ${corEq(eq.id) ? `<span class="px-3 py-1.5 rounded-lg font-bold text-sm" style="background:${corEq(eq.id)};color:${ipmContraste(corEq(eq.id))}">${esc(eq.nome)}</span>` : ''}
      ${navData('mudarMes(-1)', nomeMes(mesSel), 'mudarMes(1)')}
    </div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-2 md:gap-3 mb-4">
      ${cardNum(tD, 'Plantões D', 'text-amber-700')}${cardNum(tN, 'Plantões N', 'text-indigo-700')}${cardNum(horas.toFixed(0) + 'h', 'Horas (agente)', 'text-primary')}
      ${cardNum(fmtHoras(exEq.horas) + 'h', 'Horas extras da equipe', 'text-rose-700')}${cardNum(exEq.escalas, 'Escalas extras', 'text-rose-700')}
    </div>
    <div class="grid gap-4 lg:grid-cols-2">

      <div class="space-y-4">
        <div class="${CARD} p-4">
          <div class="flex items-center justify-between gap-2 mb-2">
            <h3 class="font-semibold">Membros (${sups.length + ags.length})</h3>
            <button onclick="abrirSeletor('${eq.id}')" class="${BTN_P}">+ Adicionar guardas</button>
          </div>
          ${prob.length ? `<div class="bg-red-50 text-red-700 rounded-lg px-3 py-2 text-xs mb-2">⚠ ${esc(prob.join(', '))}</div>` : ''}
          <div class="text-xs text-slate-500 mt-2">Supervisor</div>
          ${sups.length ? `<ul class="text-sm">${sups.map(pessoa).join('')}</ul>` : '<p class="text-sm text-slate-400 py-2">Nenhum supervisor.</p>'}
          <div class="text-xs text-slate-500 mt-2">Agentes</div>
          ${ags.length ? `<ul class="text-sm">${ags.map(pessoa).join('')}</ul>` : '<p class="text-sm text-slate-400 py-2">Nenhum agente.</p>'}
        </div>
        <div class="${CARD} p-4">
          <div class="flex items-center justify-between gap-2 mb-2">
            <h3 class="font-semibold">Ciclo e âncoras</h3>
            <div class="flex gap-2"><button onclick="formEquipe('${eq.id}')" class="${BTN_G}">Editar</button><button onclick="formReancorar('${eq.id}')" class="${BTN_O}">Reancorar</button></div>
          </div>
          <p class="text-sm text-slate-600 mb-2">${esc(ciclo.nome)} · [${ciclo.sequencia.join(' ')}]</p>
          ${eq.chefia ? `<p class="text-sm text-slate-600 mb-2">Chefia imediata: ${esc(eq.chefia)}</p>` : ''}
          <ul class="text-sm">${hist.map((h, i) => `<li class="flex items-center justify-between gap-2 py-2 border-b border-slate-100 last:border-0">
            <span>${h.vigencia === INICIAL ? 'Âncora inicial' : `Desde ${br(h.vigencia)}`}: 1º dia em ${br(h.data)}</span>
            ${i > 0 ? `<button onclick="removerAncora('${eq.id}','${h.vigencia}')" class="tt px-3 rounded-lg text-xs text-red-600 hover:bg-red-50">Remover</button>` : ''}</li>`).join('')}</ul>
        </div>
      </div>
    </div>`;
}
function removerDaEquipe(gid) {

  confirmar('Remover da equipe', `<p><b>${esc(g.nomeCompleto)}</b> ficará sem equipe. O cadastro continua no banco.</p>`, () => {

/* ---------- Reancoragem ---------- */
function formReancorar(eqId) {
  const eq = getEquipe(eqId), seq = getCiclo(eq.cicloId).sequencia;
  openModal(`Reancorar ${eq.nome}`, `

    </div>`,
    `<div class="flex gap-2 justify-end"><button onclick="closeModal()" class="${BTN_G}">Cancelar</button><button onclick="salvarReancoragem('${eqId}')" class="${BTN_P}">Salvar</button></div>`);

function salvarReancoragem(eqId) {
  const vig = $('ra-data').value, pos = Number($('ra-pos').value);
  if (!vig) { toast('Informe a data', 'error'); return; }
  const data = iso(addDays(parseISO(vig), -pos));
  state.ancorasHist = state.ancorasHist.filter(a => !(a.equipeId === eqId && a.vigencia === vig));
  state.ancorasHist.push({ equipeId: eqId, data, vigencia: vig });
  save(); closeModal(); render(); toast(`Nova âncora vale a partir de ${br(vig)}`);
}
function removerAncora(eqId, vig) {
  confirmar('Remover reancoragem', `<p>A escala a partir de ${br(vig)} volta a seguir a âncora anterior.</p>`, () => {
    state.ancorasHist = state.ancorasHist.filter(a => !(a.equipeId === eqId && a.vigencia === vig));
    save(); render(); toast('Reancoragem removida');
  }, 'Remover', true);
}

/* ============================================================
   SELETOR DE GUARDAS (adicionar à equipe a partir do banco)
   ============================================================ */
let sel = null;
function abrirSeletor(eqId, manter = false) {
  if (!manter || !sel || sel.eqId !== eqId) sel = { eqId, escolhidos: new Set(), filtro: 'sem', q: '' };
  const eq = getEquipe(eqId);
  openModal(`Adicionar guardas · ${eq.nome}`, `
    <div class="sticky top-0 bg-white pb-2 -mt-1 z-10">
      <input id="sel-q" value="${esc(sel.q)}" oninput="sel.q=this.value;listaSeletor()" placeholder="Buscar por nome, nome de guerra ou matrícula" class="${INPUT}" autocomplete="off">
      <div id="sel-chips" class="flex gap-2 mt-2 overflow-x-auto"></div>
    </div>
    <div id="sel-lista" class="mt-1"></div>
    <button onclick="novoGuardaDoSeletor()" class="tt w-full mt-3 rounded-lg border border-dashed border-slate-300 text-sm text-primary">+ Cadastrar novo guarda</button>`,
    `<button id="sel-btn" onclick="confirmarSeletor()" class="${BTN_P} w-full"></button>`, true);
  listaSeletor();
}
function listaSeletor() {
  const chips = [['sem','Sem equipe'],['todos','Todos'], ...chipsFuncoes()];
  $('sel-chips').innerHTML = chips.map(([k, l]) => `<button onclick="sel.filtro='${k}';listaSeletor()" class="h-9 px-3 rounded-full text-sm whitespace-nowrap border ${sel.filtro === k ? 'bg-primary text-white border-transparent' : 'bg-white border-slate-300'}">${l}</button>`).join('');
  const q = norm(sel.q);
  const lista = guardasOrdenados().filter(g => {
    if (sel.filtro === 'sem' && g.equipeId && !sel.escolhidos.has(g.id)) return false;
    if (!['sem', 'todos'].includes(sel.filtro) && g.funcao !== sel.filtro) return false;
    return !q || norm(g.nomeCompleto).includes(q) || norm(g.nomeGuerra).includes(q) || norm(g.matricula).includes(q);
  });
  $('sel-lista').innerHTML = lista.length ? lista.map(g => {
    const aqui = g.equipeId === sel.eqId, outra = g.equipeId && !aqui ? getEquipe(g.equipeId) : null;
    const marcado = aqui || sel.escolhidos.has(g.id);
    return `<label class="flex items-center gap-3 py-2.5 px-2 rounded-lg border-b border-slate-100 ${aqui ? 'opacity-60' : 'cursor-pointer hover:bg-slate-50'}">
      <input type="checkbox" class="w-5 h-5 accent-teal-700 shrink-0" ${marcado ? 'checked' : ''} ${aqui ? 'disabled' : ''} onchange="toggleSel('${g.id}',this.checked)">
      <div class="min-w-0 flex-1">
        <div class="font-semibold text-sm truncate">${esc(g.nomeGuerra || g.nomeCompleto)}${badgeFuncao(g)}</div>
        <div class="text-xs text-slate-500 truncate">${esc(g.nomeCompleto)} · ${esc(g.matricula || 'sem matrícula')}</div>
      </div>
      <span class="text-[11px] px-2 py-1 rounded-full shrink-0 ${aqui ? 'bg-slate-100 text-slate-600' : outra ? 'bg-amber-100 text-amber-800' : 'bg-emerald-50 text-emerald-700'}">${aqui ? 'Já nesta equipe' : outra ? 'Em ' + esc(outra.nome) : 'Sem equipe'}</span>
    </label>`;
  }).join('') : '<p class="text-sm text-slate-500 text-center py-6">Nenhum guarda encontrado.</p>';
  const n = sel.escolhidos.size;
  $('sel-btn').textContent = n ? `Adicionar ${n} guarda${n > 1 ? 's' : ''}` : 'Selecione guardas';
  $('sel-btn').disabled = !n; $('sel-btn').classList.toggle('opacity-50', !n);
}
function toggleSel(id, on) { on ? sel.escolhidos.add(id) : sel.escolhidos.delete(id); listaSeletor(); }
function novoGuardaDoSeletor() { formGuarda(null, { voltarSeletor: sel.eqId }); }

function confirmarSeletor() {
  const eq = getEquipe(sel.eqId), ids = [...sel.escolhidos], gs = ids.map(getGuarda).filter(Boolean);
  if (!gs.length) return;
  const transf = gs.filter(g => g.equipeId && g.equipeId !== eq.id);
  const passoSup = () => {
    const novosSup = gs.filter(g => g.funcao === 'supervisor'), atuais = supervisores(eq.id);
    if (novosSup.length && atuais.length) {
      openModal('Supervisor', `<p class="text-sm text-slate-700 mb-3">${esc(eq.nome)} já tem supervisor (<b>${esc(atuais.map(s => s.nomeCompleto).join(', '))}</b>). O que fazer com o atual?</p>
        <div class="space-y-2">
          <button onclick="aplicarSeletor('sem')" class="${BTN_P} w-full">Substituir · atual fica sem equipe</button>
          <button onclick="aplicarSeletor('agente')" class="${BTN_O} w-full">Substituir · atual vira agente na equipe</button>
          <button onclick="aplicarSeletor('manter')" class="${BTN_G} w-full">Manter os dois</button>
        </div>`, `<button onclick="abrirSeletor('${eq.id}',true)" class="${BTN_G} w-full">Voltar</button>`);
    } else aplicarSeletor('manter');
  };
  if (transf.length) {
    openModal('Transferência de equipe', `<p class="text-sm text-slate-700 mb-2">Estes guardas serão transferidos para <b>${esc(eq.nome)}</b>:</p>
      <ul class="text-sm space-y-1">${transf.map(g => `<li>• ${esc(g.nomeGuerra || g.nomeCompleto)} <span class="text-slate-500">(sai de ${esc(getEquipe(g.equipeId).nome)})</span></li>`).join('')}</ul>`,
      `<div class="flex gap-2 justify-end"><button onclick="abrirSeletor('${eq.id}',true)" class="${BTN_G}">Voltar</button><button id="tr-ok" class="${BTN_P}">Transferir</button></div>`);
    $('tr-ok').onclick = passoSup;
  } else passoSup();
}
function aplicarSeletor(modo) {
  const eqId = sel.eqId, atuais = supervisores(eqId), ids = [...sel.escolhidos];
  if (modo === 'sem') atuais.forEach(s => { s.equipeId = null; });
  if (modo === 'agente') atuais.forEach(s => { s.funcao = 'agente'; });
  ids.forEach(id => { const g = getGuarda(id); if (g) g.equipeId = eqId; });
  sel = null; save(); closeModal(); eqSel = eqId; render();
  const prob = problemasEquipe(eqId);
  toast(`${ids.length} guarda(s) adicionado(s)`);
  if (prob.length) setTimeout(() => toast(`${getEquipe(eqId).nome}: ${prob.join(', ')}`, 'warn'), 300);
}

/* ============================================================
   VIEW: GUARDA
   ============================================================ */
let gSel = null;
function viewGuarda() {
  if (!getGuarda(gSel)) gSel = guardasOrdenados()[0]?.id || null;
  const g = getGuarda(gSel);
  if (!g) { $('main').innerHTML = `<div class="${CARD} p-8 text-center"><p class="text-sm text-slate-500 mb-3">Nenhum guarda cadastrado.</p><button onclick="go('cadastros')" class="${BTN_P}">Ir para cadastros</button></div>`; return; }
  const eq = getEquipe(g.equipeId), ciclo = eq && getCiclo(eq.cicloId), y = mesSel.getFullYear(), m = mesSel.getMonth();
  let tD = 0, tN = 0, hT = 0, hN = 0;
  for (let i = 1; i <= diasNoMes(y, m); i++) {
    const st = statusGuarda(g, new Date(y, m, i)); // ciclo + trocas − ausências
    if (st.trabalha) { st.turno === 'D' ? tD++ : tN++; hT += horasDoDia(st); hN += horasNoturnasDoDia(st); }
  }
  const prox = [];
  for (let i = 0; i < 120 && prox.length < 5; i++) { const d = addDays(new Date(), i), st = statusGuarda(g, d); if (st.trabalha) prox.push({ d, t: st.turno, st }); }
  const fmtH = h => (Number.isInteger(h) ? h : h.toFixed(1).replace('.', ',')) + 'h';
  const hExt = extrasGuardaMes(g.id, ymDe(iso(mesSel))).reduce((a, x) => a + x.h.horas, 0);

  $('main').innerHTML = `
    <div class="flex items-center gap-2 flex-wrap mb-4">
      <select onchange="gSel=this.value;render()" class="h-11 border border-slate-300 rounded-lg px-3 bg-white flex-1 md:flex-none md:min-w-[280px] max-w-full">
        ${guardasOrdenados().map(x => `<option value="${x.id}" ${x.id === gSel ? 'selected' : ''}>${esc(x.nomeGuerra || x.nomeCompleto)} · ${esc(x.matricula || 's/ mat.')}${x.equipeId ? ' · ' + esc(getEquipe(x.equipeId).nome) : ''}</option>`).join('')}
      </select>
      ${navData('mudarMes(-1)', nomeMes(mesSel), 'mudarMes(1)')}
    </div>
    <div class="${CARD} p-4 mb-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold">${esc(g.nomeCompleto)}</p>
        <p class="text-sm text-slate-500">Matrícula ${esc(g.matricula || '—')} · ${esc(nomeFuncao(g.funcao))} · ${eq ? eqTag(eq) : 'Sem equipe'}</p>
      </div>
      <button onclick="formGuarda('${g.id}')" class="${BTN_G} shrink-0">Editar</button>
    </div>
    <div class="flex gap-2 flex-wrap mb-4"><button onclick="formAusencia('', '${g.id}')" class="${BTN_O}">+ Afastamento</button><button onclick="formTroca({ aId: '${g.id}' })" class="${BTN_O}">+ Troca de escala</button><button onclick="formTJ({ gId: '${g.id}' })" class="${BTN_O}">+ Troca de jornada</button></div>
    ${eq ? `
    <div class="grid grid-cols-2 md:grid-cols-3 gap-2 md:gap-3 mb-4">
      ${cardNum(tD, 'Plantões D', 'text-amber-700')}${cardNum(tN, 'Plantões N', 'text-indigo-700')}
      ${cardNum(fmtH(hT), 'Horas regulares', 'text-primary')}${cardNum(fmtH(hN), 'Horas noturnas (22h até o fim)', 'text-indigo-700')}
      ${cardNum(fmtH(hExt), 'Horas extras', 'text-rose-700')}${cardNum(fmtH(hT + hExt), 'Total geral', 'text-slate-800')}
    </div>
    <div class="grid gap-4 lg:grid-cols-2">
      <div class="${CARD} p-4">${calendario(d => codigoVisual(statusGuarda(g, d)), d => tagExtraTexto(g, d), d => { const x = statusGuarda(g, d); return x.troca ? 'troca' : x.tj ? 'TJ' : null; })}</div>
      <div class="${CARD} p-4">
        <h3 class="font-semibold mb-2">Próximos 5 plantões</h3>
        <ul class="text-sm">${prox.map(p => { const h = p.st.horario; return `<li class="flex items-center gap-3 py-2 border-b border-slate-100 last:border-0">${badge(p.t)}<span class="flex-1">${DIA_NOME[p.d.getDay()]}, ${br(p.d)}${p.st.troca ? ' <span class="tr-tag" style="font-size:10px">troca</span>' : p.st.tj ? ' <span class="tr-tag" style="font-size:10px">TJ</span>' : ''}</span><span class="text-slate-500 text-xs">${h ? h[0] + '–' + h[1] : ''}</span></li>`; }).join('')}</ul>
      </div>
    </div>` : `<div class="${CARD} p-8 text-center text-sm text-slate-500">Este guarda está sem equipe, por isso não tem escala. Inclua-o numa equipe em Equipes ou pelo botão Editar.</div>`}
    ${secaoOcorrenciasGuarda(g)}${secaoExtrasGuarda(g)}`;
}

function formGuarda(id, ctx = null) {

  const g = id ? getGuarda(id) : { nomeCompleto: '', nomeGuerra: '', matricula: '', funcao: 'agente', equipeId: null };

        ${state.equipes.map(e => `<option value="${e.id}" ${e.id === g.equipeId ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select></div>
    </div>`,
    `<div class="flex gap-2">
      ${id ? `<button onclick="excluirGuarda('${id}')" class="${BTN} text-red-600 border border-red-200">Excluir</button>` : ''}
      <button onclick="${ctx?.voltarSeletor ? `abrirSeletor('${ctx.voltarSeletor}',true)` : 'closeModal()'}" class="${BTN_G} ml-auto">Cancelar</button>
      <button onclick="salvarGuarda('${id || ''}')" class="${BTN_P}">Salvar</button></div>`);
}
function salvarGuarda(id) {
  const dados = { nomeCompleto: $('g-nome').value.trim(), nomeGuerra: $('g-guerra').value.trim(), matricula: $('g-mat').value.trim(), nomeEdital: $('g-edital').value.trim(), funcao: $('g-func').value, equipeId: $('g-eq').value || null };
  if (!dados.nomeCompleto) { toast('Informe o nome completo', 'error'); return; }
  const dup = dados.matricula && state.guardas.find(g => g.matricula === dados.matricula && g.id !== id);
  if (dup) { toast(`Matrícula já cadastrada para ${dup.nomeCompleto}`, 'error'); return; }
  const g = id ? getGuarda(id) : { id: uid('g') };
  const antesEq = g.equipeId;
  const executar = () => {
    Object.assign(g, dados); if (!id) state.guardas.push(g);
    save();
    const ctx = _ctxGuarda; _ctxGuarda = null;
    if (ctx?.voltarSeletor) { if (g.equipeId !== ctx.voltarSeletor) sel.escolhidos.add(g.id); abrirSeletor(ctx.voltarSeletor, true); render(); toast('Guarda cadastrado'); return; }
    closeModal(); render(); toast('Guarda salvo');
    if (dados.equipeId) { const p = problemasEquipe(dados.equipeId); if (p.some(x => x.includes('supervisores'))) setTimeout(() => toast(`${getEquipe(dados.equipeId).nome}: ${p.join(', ')}`, 'warn'), 300); }
  };
  if (id && antesEq && dados.equipeId && antesEq !== dados.equipeId) {
    confirmar('Transferir de equipe', `<p><b>${esc(dados.nomeCompleto)}</b> sai de <b>${esc(getEquipe(antesEq).nome)}</b> e vai para <b>${esc(getEquipe(dados.equipeId).nome)}</b>.</p>`, executar, 'Transferir');
  } else executar();
}
function excluirGuarda(id) {
  const g = getGuarda(id);
  confirmar('Excluir guarda', '<p>Excluir <b>' + esc(g.nomeCompleto) + '</b> do banco? Você poderá desfazer por 10 segundos.</p>', () => {
    const undo = _undoPush('excluir guarda', _undoSnapshot());
    state.guardas = state.guardas.filter(x => x.id !== id);
    state.horasExtras.forEach(h => { h.escalados = h.escalados.filter(e => e.guardaId !== id); });
    state.ausencias = state.ausencias.filter(a => a.guardaId !== id);
    state.trocasJornada = state.trocasJornada.filter(t => t.guardaId !== id);
    state.trocas = state.trocas.filter(t => t.a.guardaId !== id && t.b.guardaId !== id);
    save(); render();
    toast('Guarda excluído', 'ok', { label: 'Desfazer', fn: () => _undoAplicar(undo) });
  }, 'Excluir', true);
}

function salvarEquipe(id) {

function excluirEquipe(id) {

/* ---------- Ciclo ---------- */
function formCiclo(id) {
  const c = id ? getCiclo(id) : { nome: '', sequencia: ['D','F'], horarios: cicloPadrao()[0].horarios };
  const campo = (t, f, i, rot) => `<div><label class="block text-xs text-slate-500 mb-1">${rot}</label><input id="h-${t}-${f}-${i}" type="time" value="${c.horarios[t][f][i]}" class="${INPUT}"></div>`;

    <div class="mt-2"><label class="block text-xs text-slate-500 mb-1">Pausa não trabalhada (minutos). Ex.: 60 no expediente com almoço</label><input id="h-${t}-pausa" type="number" min="0" step="5" inputmode="numeric" value="${c.horarios[t].pausaMin || 0}" class="${INPUT}"></div></div>`;
  openModal(id ? 'Editar ciclo' : 'Novo ciclo', `
    <div class="space-y-3">

        <p class="text-xs text-slate-500 mt-1">Ex.: D,N,F,F,F para o 12x24x12x72.</p></div>
      ${bloco('D', 'Diurno')}${bloco('N', 'Noturno')}
      <label class="flex items-start gap-3 text-sm"><input id="c-feriados" type="checkbox" class="w-5 h-5 accent-teal-700 mt-0.5" ${c.folgaNosFeriados ? 'checked' : ''}><span><b>Folga nos feriados</b><br><span class="text-xs text-slate-500">Para expediente: nas datas cadastradas em Configurações › Feriados, o turno vira folga.</span></span></label>
      <p class="text-xs text-slate-500">Turnos que viram a meia-noite: informe a saída normalmente (ex.: 19:00 às 07:00).</p>
    </div>`,

      <button onclick="salvarCiclo('${id || ''}')" class="${BTN_P}">Salvar</button></div>`);

function salvarCiclo(id) {
  const nome = $('c-nome').value.trim();
  const tokens = $('c-seq').value.split(/[,;\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  if (!nome || !tokens.length) { toast('Preencha nome e sequência', 'error'); return; }
  if (tokens.some(t => !['D','N','F'].includes(t))) { toast('A sequência aceita só D, N ou F', 'error'); return; }
  const h = {}; ['D','N'].forEach(t => { h[t] = {}; ['agente','supervisor'].forEach(f => { h[t][f] = [$(`h-${t}-${f}-0`).value, $(`h-${t}-${f}-1`).value]; }); });
  for (const t of ['D','N']) if (tokens.includes(t)) for (const f of ['agente','supervisor']) if (!h[t][f][0] || !h[t][f][1]) { toast(`Informe os horários do turno ${t}`, 'error'); return; }
  ['D','N'].forEach(t => { h[t].pausaMin = Math.max(0, parseInt($(`h-${t}-pausa`).value, 10) || 0); });
  const folgaNosFeriados = $('c-feriados').checked;
  if (id) Object.assign(getCiclo(id), { nome, sequencia: tokens, horarios: h, folgaNosFeriados });
  else state.ciclos.push({ id: uid('c'), nome, sequencia: tokens, horarios: h, folgaNosFeriados });

function excluirCiclo(id) {

function adivinhar(cab) {
  const map = { nome: -1, guerra: -1, mat: -1, funcao: -1, equipe: -1 };
  cab.forEach((c, i) => {
    const n = norm(c);
    if (map.guerra < 0 && n.includes('guerra')) map.guerra = i;
    else if (map.mat < 0 && (n.includes('matric') || n === 'mat' || n === 'rf' || n.includes('registro'))) map.mat = i;
    else if (map.funcao < 0 && (n.includes('func') || n.includes('cargo') || n.includes('posto'))) map.funcao = i;
    else if (map.equipe < 0 && (n.includes('equipe') || n.includes('turma') || n.includes('grupo') || n.includes('escala'))) map.equipe = i;
    else if (map.nome < 0 && n.includes('nome')) map.nome = i;

function impMapear(matriz) {

function lerFuncao(raw) {
  const n = norm(raw);
  if (!n) return { funcao: 'agente', ok: true };
  const propria = state.funcoes.find(f => norm(f.nome) === n);
  if (propria) return { funcao: propria.id, ok: true };
  if (/^(sup|suepe|supervis|super\b|super\s)/.test(n) || n.includes('supervis')) return { funcao: 'supervisor', ok: true };
  if (['agente','gm','guarda','guarda municipal','agente gm','gcm','ag'].includes(n) || n.startsWith('agente') || n.startsWith('guarda')) return { funcao: 'agente', ok: true };
  return { funcao: 'agente', ok: false };
}
function impPreview() {

  const col = (l, k) => imp.map[k] >= 0 ? String(l[imp.map[k]] ?? '').trim() : '';

    const f = lerFuncao(col(l, 'funcao')), eqNome = col(l, 'equipe').toUpperCase();
    const eq = eqNome ? state.equipes.find(e => norm(e.nome) === norm(eqNome)) : null;
    return { nome: col(l, 'nome'), guerra: col(l, 'guerra'), mat: col(l, 'mat').replace(/\.0$/, ''), funcaoRaw: col(l, 'funcao'), funcao: f.funcao, funcaoOk: f.ok,

  });
  impStatus(); renderPreview();
}
function impStatus() {
  const contagem = {};
  imp.itens.forEach(p => { if (p.mat) contagem[p.mat] = (contagem[p.mat] || 0) + 1; });
  imp.itens.forEach(p => {
    const msgs = []; let st = 'novo';
    p.existente = (p.mat && state.guardas.find(g => g.matricula === p.mat)) || state.guardas.find(g => norm(g.nomeCompleto) === norm(p.nome));
    if (!p.nome) { st = 'erro'; msgs.push('Nome vazio'); }
    else if (p.mat && contagem[p.mat] > 1) { st = 'erro'; msgs.push('Matrícula repetida no arquivo'); }
    else {
      if (p.existente) { st = 'atualizar'; msgs.push(p.mat && p.existente.matricula === p.mat ? 'Matrícula já cadastrada: dados serão atualizados' : 'Nome já cadastrado: dados serão atualizados' + (p.mat && p.existente.matricula !== p.mat ? ' e matrícula preenchida' : '')); }
      if (!p.mat) msgs.push('Sem matrícula');
      if (!p.funcaoOk) msgs.push(`Função "${p.funcaoRaw}" não reconhecida (ficou Agente)`);
      if (p.equipe.startsWith('novo:')) msgs.push(`Equipe ${p.equipe.slice(5)} não existe`);
      if ((!p.mat && !p.existente) || !p.funcaoOk || p.equipe.startsWith('novo:')) st = 'atencao';
    }
    p.status = st; p.msgs = msgs;
  });
}
const ST = { novo: ['Novo','bg-emerald-50 border-emerald-200','bg-emerald-600'], atualizar: ['Atualizar','bg-blue-50 border-blue-200','bg-blue-600'],

    <div class="grid gap-2 md:grid-cols-2">${imp.itens.map((p, i) => `

        ${p.status !== 'erro' ? `<div class="grid grid-cols-2 gap-2 mt-2">

  Object.assign(state, clone(state._backupImport)); state._backupImport = null;
  save(); closeModal(); render(); toast('Importação desfeita');

/* ============================================================
   FUNÇÕES (cadastro dinâmico)
   Os ids 'agente' e 'supervisor' são mantidos para compatibilidade
   com dados antigos. A lógica de supervisor continua baseada em
   funcao === 'supervisor'. Funções novas usam o horário do Agente

   ============================================================ */
function funcoesPadrao() {

}
const getFuncao = id => state.funcoes.find(f => f.id === id);

function funcaoOpts(sel) { return state.funcoes.map(f => `<option value="${esc(f.id)}" ${f.id === sel ? 'selected' : ''}>${esc(f.nome)}</option>`).join(''); }
function chipsFuncoes() { return state.funcoes.map(f => [f.id, f.id === 'agente' ? 'Agentes' : f.id === 'supervisor' ? 'Supervisores' : f.nome]); }
function badgeFuncao(g) {

function formFuncao(id) {

  openModal(id ? 'Editar função' : 'Nova função', `
    <div class="space-y-3">

      <label class="flex items-start gap-3 text-sm"><input id="fn-sup" type="checkbox" class="w-5 h-5 accent-teal-700 mt-0.5" ${f.podeSupervisionar ? 'checked' : ''}>

function salvarFuncao(id) {
  const nome = $('fn-nome').value.trim(), pode = $('fn-sup').checked;
  if (!nome) { toast('Informe o nome da função', 'error'); return; }
  if (state.funcoes.some(f => norm(f.nome) === norm(nome) && f.id !== id)) { toast('Já existe função com esse nome', 'error'); return; }
  if (id) { const f = getFuncao(id); f.nome = nome; f.podeSupervisionar = pode; }
  else state.funcoes.push({ id: uid('f'), nome, podeSupervisionar: pode, fixa: false });

function excluirFuncao(id) {
  const f = getFuncao(id); if (!f) return;

/* ============================================================
   HORAS EXTRAS — camada adicional sobre a escala ordinária.
   Nada aqui altera âncora, ciclo, sequência ou turno D/N/F.
   A hora extra do guarda é sempre derivada de horasExtras[].escalados.
   ============================================================ */
const getExtra = id => state.horasExtras.find(h => h.id === id);
function round2(n) { return Math.round(n * 100) / 100; }
function fmtHoras(h) { h = round2(Number(h || 0)); return Number.isInteger(h) ? String(h) : String(h).replace('.', ','); }
function fmtDur(h) { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`; }
function descansoTxt(h) { if (h === null || h === undefined) return 'sem jornada anterior'; h = round2(h); return Number.isInteger(h) ? `${h} hora${h === 1 ? '' : 's'}` : fmtDur(h); }
// duração em minutos, atravessando a meia-noite quando necessário (19:00 → 07:00 = 720)
function duracaoMin(ini, fim) { if (!ini || !fim) return 0; let m = minutos(fim) - minutos(ini); if (m <= 0) m += 1440; return m; }
function hhmmDe(ms) { const d = new Date(ms); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function descJornada(j) {
  if (j.tipo === 'ausencia') return `${j.rotulo} de ${br(j.aus.inicio)} a ${j.aus.fim ? br(j.aus.fim) : 'data em aberto'}`;
  const a = new Date(j.ini), b = new Date(j.fim);
  return iso(a) === iso(b) ? `${br(a)} — ${hhmmDe(j.ini)} às ${hhmmDe(j.fim)}` : `${br(a)} ${hhmmDe(j.ini)} às ${br(b)} ${hhmmDe(j.fim)}`;
}
const ymDe = dataISO => String(dataISO).slice(0, 7);

/* Analisa se o guarda pode assumir o intervalo [ini, fim] (hora extra ou plantão de troca).

    // dispensa de serviço: o dia deixa de ser escala do guarda, então ele PODE pegar hora extra (férias, atestado e afastamento continuam bloqueando)
    if (au && !(opts.extra && au.tipo === 'dispensa')) return { status: 'bloqueado', conflito: { tipo: 'ausencia', aus: au, rotulo: AUS_TIPOS[au.tipo].nome, ini: dd.getTime(), fim: dd.getTime() + DIA } };

  openModal(id ? 'Editar vaga de hora extra' : 'Nova vaga de hora extra', `
    <div class="grid gap-3 md:grid-cols-2">
      <div><label class="block text-sm font-medium mb-1">Data</label><input id="he-data" type="date" value="${esc(h.data)}" class="${INPUT}"></div>
      <div><label class="block text-sm font-medium mb-1">Número de vagas</label><input id="he-vagas" type="number" min="1" step="1" inputmode="numeric" value="${esc(h.vagas)}" class="${INPUT}"></div>
      <div><label class="block text-sm font-medium mb-1">Início</label><input id="he-ini" type="time" value="${esc(h.inicio)}" oninput="atualizarHorasExtra()" class="${INPUT}"></div>
      <div><label class="block text-sm font-medium mb-1">Término</label><input id="he-fim" type="time" value="${esc(h.fim)}" oninput="atualizarHorasExtra()" class="${INPUT}"></div>
      <div class="md:col-span-2"><label class="block text-sm font-medium mb-1">Quantidade de horas (calculada)</label><input id="he-horas" readonly class="${INPUT} bg-slate-50"></div>
      <div class="md:col-span-2"><label class="block text-sm font-medium mb-1">Motivo</label><input id="he-motivo" value="${esc(h.motivo || '')}" class="${INPUT}" placeholder="Ex.: Cobertura operacional"></div>
    </div>
    <p class="text-xs text-slate-500 mt-3">Criar a vaga não consome o limite mensal. O consumo ocorre quando um guarda é escalado.</p>`,
    `<div class="flex gap-2"><button onclick="closeModal()" class="${BTN_G} ml-auto">Cancelar</button><button onclick="salvarExtra('${id || ''}')" class="${BTN_P}">Salvar</button></div>`);
  atualizarHorasExtra();
}
function atualizarHorasExtra() {
  const ini = $('he-ini').value, fim = $('he-fim').value;
  $('he-horas').value = ini && fim && ini !== fim ? `${fmtHoras(duracaoMin(ini, fim) / 60)} horas` : '—';
}
function salvarExtra(id) {
  const data = $('he-data').value, vagas = parseInt($('he-vagas').value, 10), inicio = $('he-ini').value, fim = $('he-fim').value, motivo = $('he-motivo').value.trim();
  if (!data) { toast('Informe a data', 'error'); return; }
  if (!(vagas >= 1)) { toast('Informe ao menos 1 vaga', 'error'); return; }
  if (!inicio || !fim) { toast('Informe início e término', 'error'); return; }
  if (inicio === fim) { toast('Início e término iguais: informe horários diferentes', 'error'); return; }
  const horas = round2(duracaoMin(inicio, fim) / 60);
  if (!id) {
    state.horasExtras.push({ id: uid('he_'), data, vagas, inicio, fim, horas, motivo, escalados: [] });
    save(); closeModal(); render(); toast('Vaga criada'); return;
  }
  const he = getExtra(id), n = he.escalados.length;
  const rasc = { ...he, data, vagas, inicio, fim, horas, motivo };
  if (vagas < n) { toast(`Já há ${n} guarda${n > 1 ? 's' : ''} escalado${n > 1 ? 's' : ''}: as vagas não podem ser menos que isso.`, 'error'); return; }
  const lim = limiteMes(ymDe(data));
  if (lim !== null) {
    const total = round2(horasUsadasMes(ymDe(data), id) + horas * n);
    if (total > lim + 1e-9) { toast(`Com a alteração o consumo de ${nomeMes(parseISO(data))} seria ${fmtHoras(total)}h, acima do limite de ${fmtHoras(lim)}h.`, 'error'); return; }
  }
  const res = he.escalados.map(e => ({ e, g: getGuarda(e.guardaId), an: analisarExtra(getGuarda(e.guardaId), rasc) }));
  const bloq = res.filter(x => x.an.status === 'bloqueado');
  if (bloq.length) { toast(`Conflito de horário: ${bloq.map(x => x.g.nomeGuerra || x.g.nomeCompleto).join(', ')} (${descJornada(bloq[0].an.conflito)}).`, 'error'); return; }

  };
  if (novos.length) mostrarAlertaDescanso(novos.map(x => ({ g: x.g, an: x.an })), rasc, 'Salvar mesmo assim', 'Deseja salvar a alteração mesmo assim?', aplicar, () => formExtra(id, rasc));

    <p>${n ? `<b>${n} guarda${n > 1 ? 's estão escalados' : ' está escalado'}</b>; a hora extra será removida da escala deles e as ${fmtHoras(he.horas * n)}h voltam ao limite.` : 'Nenhum guarda está escalado.'}</p>`, () => {
    state.horasExtras = state.horasExtras.filter(h => h.id !== id); save(); render(); toast('Vaga excluída');

/* ---------- Limite mensal ---------- */

  const ym = ymDe(iso(mesSel)), atual = limiteMes(ym);
  openModal(`Limite · ${nomeMes(mesSel)}`, `
    <p class="text-sm text-slate-600 mb-3">Horas utilizadas: <b>${fmtHoras(horasUsadasMes(ym))}h</b>. O limite só é consumido quando um guarda é escalado.</p>

    <p class="text-xs text-slate-500 mt-2">Deixe em branco para remover o limite deste mês.</p>`,
    `<div class="flex gap-2"><button onclick="closeModal()" class="${BTN_G} ml-auto">Cancelar</button><button onclick="salvarLimite('${ym}')" class="${BTN_P}">Salvar</button></div>`);

function salvarLimite(ym) {
  const v = $('lim-v').value.trim();
  if (v === '') delete state.limitesExtras[ym];
  else {
    const n = Number(v.replace(',', '.')), usadas = horasUsadasMes(ym);
    if (!(n >= 0)) { toast('Informe um número válido', 'error'); return; }
    if (n + 1e-9 < usadas) { toast(`Já há ${fmtHoras(usadas)}h utilizadas: o limite não pode ser menor.`, 'error'); return; }
    state.limitesExtras[ym] = n;
  }
  save(); closeModal(); render(); toast('Limite salvo');

/* ============================================================

const AUS_TIPOS = {

/* Quem está de serviço numa equipe num dia, já com ausências e trocas */
function equipeNoDia(eq, t, d) {
  const sups = [], ags = [], ausentes = [], subs = new Set();
  membros(eq.id).forEach(g => {
    const st = statusGuarda(g, d);
    if (st.ausencia) { ausentes.push({ g, motivo: AUS_TIPOS[st.ausencia.tipo].nome }); return; }
    if (st.tj) { ausentes.push({ g, motivo: st.tj.papel === 'saida' ? `Troca de jornada (folga; trabalha em ${brCurto(parseISO(st.tj.ref))})` : 'Troca de jornada' }); return; }
    if (st.troca) { ausentes.push({ g, motivo: st.troca.papel === 'saida' ? `Troca (entregou a ${nomeG(st.troca.com)})` : `Em troca (cobre ${nomeG(st.troca.com)})` }); return; }

/* ---------- Trocas de escala ---------- */
/* Troca: A entrega o plantão de dA e B assume. Se houver devolução, B entrega o
   plantão de dB e A assume. Nada disso altera o ciclo: é só a camada de trocas. */
function validarTroca(d) {
  const erros = [], alertas = [], pernas = [], entradas = [];
  const A = getGuarda(d.aId), B = getGuarda(d.bId);
  if (!A || !B) return { erros: ['Escolha os dois guardas.'], alertas, pernas, entradas };
  if (A.id === B.id) return { erros: ['Os dois guardas precisam ser diferentes.'], alertas, pernas, entradas };
  if (!d.da) return { erros: ['Informe a data do plantão entregue.'], alertas, pernas, entradas };
  const db = d.db || null;
  const legs = [{ de: A, para: B, data: d.da }]; if (db) legs.push({ de: B, para: A, data: db });
  const salvos = state.trocas;
  state.trocas = salvos.filter(t => t.id !== d.ignoraId).concat([{ id: '__tmp', a: { guardaId: A.id, data: d.da }, b: { guardaId: B.id, data: db } }]);
  try {
    for (const L of legs) {
      const dt = parseISO(L.data), k = L.data, nDe = nomeG(L.de.id), nPara = nomeG(L.para.id);
      const jb = jornadaBaseGuarda(L.de, dt);
      if (!jb) { erros.push(`${nDe} não tem plantão em ${br(dt)}.`); continue; }
      const auDe = ausenciaDoDia(L.de.id, k);
      if (auDe) { erros.push(`${nDe} está com ${AUS_TIPOS[auDe.tipo].nome.toLowerCase()} em ${br(dt)}.`); continue; }
      const xDe = trocasDoDia(L.de, k, '__tmp');
      if (xDe.saida || xDe.entrada) { erros.push(`${nDe} já tem outra troca em ${br(dt)}.`); continue; }
      const xPara = trocasDoDia(L.para, k, '__tmp');
      const tjDe = tjDoDia(L.de, k); if (tjDe.saida || tjDe.entrada) { erros.push(`${nDe} tem troca de jornada em ${br(dt)}.`); continue; }
      const tjPara = tjDoDia(L.para, k); if (tjPara.entrada) { erros.push(`${nPara} já trabalha em ${br(dt)} por troca de jornada.`); continue; }
      if (xPara.entrada) { erros.push(`${nPara} já assume outro plantão em ${br(dt)}.`); continue; }
      const an = analisarIntervalo(L.para, jb.ini, jb.fim, { ignoraTrocaId: '__tmp' });
      if (an.status === 'bloqueado') { erros.push(msgConflito(nPara, an)); continue; }
      pernas.push({ data: k, de: L.de, para: L.para, turno: jb.turno, hor: `${jb.horario[0]}–${jb.horario[1]}`, an });
      entradas.push({ guardaId: L.para.id, data: k, ...camposAuditoria(an) });
      if (an.status === 'alerta') alertas.push({ g: L.para, an, novaTxt: descJornada(jb), rotuloNova: 'Plantão assumido' });
    }
  } finally { state.trocas = salvos; }
  return { erros, alertas, pernas, entradas };
}

/* ---------- Troca de jornada (feita pelo próprio guarda) ----------
   O guarda deixa de trabalhar num dia de serviço (de) e cumpre o MESMO plantão num dia
   em que estaria de folga (para). Não envolve outro guarda; ciclo e âncora não mudam. */
const getTJ = id => state.trocasJornada.find(t => t.id === id);
function validarTJ(d) {
  const vazio = erros => ({ erros, alertas: [], info: null, entrada: null }), g = getGuarda(d.gId);
  if (!g) return vazio(['Escolha o guarda.']);
  if (d.mudar) return validarMudancaTurno(d, g, vazio);
  if (!d.de || !d.para) return vazio(['Informe o dia de serviço e o dia de folga.']);
  if (d.de === d.para) return vazio(['Os dois dias precisam ser diferentes.']);
  const nome = nomeG(g.id), dtDe = parseISO(d.de), dtPara = parseISO(d.para), erros = [];
  const jb = jornadaBaseGuarda(g, dtDe), tE = jb && d.turnoE && d.turnoE !== jb.turno ? d.turnoE : '', hE = tE ? horario(jb.ciclo, tE, g.funcao) : (jb && jb.horario);
  if (tE && !hE) erros.push(`O ciclo da equipe de ${nome} não tem turno ${tE === 'D' ? 'diurno' : 'noturno'}.`);
  if (!jb) erros.push(`${nome} não tem plantão em ${br(dtDe)} (dia de serviço).`);
  if (jornadaBaseGuarda(g, dtPara)) erros.push(`${nome} já trabalha em ${br(dtPara)}: o outro dia precisa ser de folga.`);
  [[d.de, dtDe], [d.para, dtPara]].forEach(([k, dt]) => {
    const au = ausenciaDoDia(g.id, k), x = trocasDoDia(g, k), y = tjDoDia(g, k);

function secaoOcorrenciasGuarda(g) {

/* ============================================================
   DOCUMENTOS: edital mensal da escala (impressão) e boletim diário
   Tudo é derivado dos dados já cadastrados: nada é digitado de novo.

const MESES_EXT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_EXT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

const p2 = n => String(n).padStart(2, '0');
const impresso = g => String(g.nomeEdital || g.nomeGuerra || g.nomeCompleto || '').trim().toUpperCase();
const foraDoEdital = g => ['superintendente', 'coordenador'].includes(g.funcao); // comando não consta nas listas
const hhU = s => { const [h, m] = String(s).split(':'); return m === '00' ? `${h}H` : `${h}H${m}`; };
const hhL = s => hhU(s).toLowerCase();
const letraEq = eq => String(eq.nome).trim().split(/\s+/).pop().charAt(0).toUpperCase();

function rotuloCiclo(c) {
  const m = /(\d+)\s*x\s*(\d+)\s*x\s*(\d+)\s*x\s*(\d+)/i.exec(c.nome || '');

}
function partir2(nomes) { const h = Math.ceil(nomes.length / 2); return [nomes.slice(0, h), nomes.slice(h)]; }
const equipesDoGrupo = gr => state.equipes.filter(e => e.grupo === gr);

/* ---------- Edital mensal ---------- */
function feriasDoMes(ano, mes) {
  const ini = iso(new Date(ano, mes, 1)), fim = iso(new Date(ano, mes + 1, 0));

}
function periodoFerias(a, ano, mes) {

}
/* ---------- Layout oficial: cabeçalho, edital e boletim ---------- */
const CAB_PADRAO = ['ESTADO DO PARANÁ', 'MUNICÍPIO DE PINHAIS', 'SUPERINTENDÊNCIA DA GUARDA MUNICIPAL'];

  return [D && c.sequencia.includes('D') ? `${hhL(D[0])}–${hhL(D[1])}` : null, N && c.sequencia.includes('N') ? `${hhL(N[0])}–${hhL(N[1])}` : null].filter(Boolean).join(' / '); };
const dataExtenso = d => `${d.getDate()} de ${MESES_EXT[d.getMonth()].toLowerCase()} de ${d.getFullYear()}`;

function calendarioHTML(ano, mes, ops, ppc, romu, heDia) {

function editalHTML(ano, mes) {
  const ferias = feriasDoMes(ano, mes), comFerias = new Set(ferias.map(a => a.guardaId));

  const colunas = cols => { const comTitulo = cols.some(c => c.titulo); return `<div class="cols n${cols.length}">${cols.map(c => `<div class="col">${comTitulo ? `<div class="col-h">${c.titulo ? esc(c.titulo) : '&nbsp;'}</div>` : ''}${ul(c.nomes)}</div>`).join('')}</div>`; };

/* ---------- Boletim diário ---------- */
let docIncluirAtestado = false;

    return { sups: r.sups.map(impresso), agentes: r.ags.map(g => impresso(g) + (r.subs.has(g.id) ? ' (troca)' : '')),
      // atestado é informação de saúde: sem a opção marcada, a lista diz só "ausente"

  const ops = equipesDoGrupo('Operacional'), servico = [];

/* ---------- Exportação .ics ---------- */
function _icsEscapar(txt) { return String(txt || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }
function _icsDataHora(date) { const p = n => String(n).padStart(2, '0'); return date.getUTCFullYear() + p(date.getUTCMonth() + 1) + p(date.getUTCDate()) + 'T' + p(date.getUTCHours()) + p(date.getUTCMinutes()) + p(date.getUTCSeconds()) + 'Z'; }
function gerarICS(guardaId, de, ate) {
  const g = getGuarda(guardaId); if (!g) return null;
  const inicio = parseISO(de), fim = parseISO(ate);
  const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Escalas GM//PT-BR//', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + _icsEscapar('Escala de ' + (g.nomeGuerra || g.nomeCompleto))];
  const agora = _icsDataHora(new Date());
  for (let d = new Date(inicio); d <= fim; d = addDays(d, 1)) {
    const st = statusGuarda(g, d); if (!st.trabalha || !st.horario) continue;
    const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, minutos(st.horario[0]));
    const df = new Date(dt.getTime() + duracaoMin(st.horario[0], st.horario[1]) * 60000);
    const eq = g.equipeId ? getEquipe(g.equipeId) : null;
    const resumo = 'Plantão ' + (st.turno === 'D' ? 'diurno' : 'noturno') + (eq ? ' · ' + eq.nome : '');
    linhas.push('BEGIN:VEVENT', 'UID:' + g.id + '-' + iso(d) + '-' + st.turno + '@escalasgm', 'DTSTAMP:' + agora, 'DTSTART:' + _icsDataHora(dt), 'DTEND:' + _icsDataHora(df), 'SUMMARY:' + _icsEscapar(resumo), 'DESCRIPTION:' + _icsEscapar(g.nomeCompleto), 'STATUS:CONFIRMED', 'TRANSP:OPAQUE', 'END:VEVENT');
  }
  linhas.push('END:VCALENDAR');
  return linhas.join('\r\n');
}
async function baixarICS(guardaId, de, ate) {
  const conteudo = gerarICS(guardaId, de, ate); if (!conteudo) return;
  const g = getGuarda(guardaId);
  const nome = 'Escala_' + slugNome(g.nomeGuerra || g.nomeCompleto) + '_' + de + '_a_' + ate + '.ics';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/calendar' })); a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Calendário gerado');
}
function abrirICSGuarda(guardaId) {
  const g = getGuarda(guardaId); if (!g) return;
  const hoje = new Date(), iniPadrao = iso(hoje), fimPadrao = iso(addDays(hoje, 60));
  openModal('Exportar calendário — ' + esc(g.nomeGuerra || g.nomeCompleto), '<div class="space-y-3"><p class="text-sm text-slate-600">Gera um arquivo <code>.ics</code> com os plantões do período.</p><div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium mb-1">De</label><input id="ics-de" type="date" value="' + iniPadrao + '" class="' + INPUT + '"></div><div><label class="block text-sm font-medium mb-1">Até</label><input id="ics-ate" type="date" value="' + fimPadrao + '" class="' + INPUT + '"></div></div></div>', '<div class="flex gap-2"><button onclick="closeModal()" class="' + BTN_G + '">Cancelar</button><button onclick="confirmarICS(\'' + guardaId + '\')" class="' + BTN_P + '">Baixar .ics</button></div>');
}
function confirmarICS(guardaId) {
  const de = $('ics-de').value, ate = $('ics-ate').value;
  if (!de || !ate || ate < de) { toast('Verifique o período', 'error'); return; }
  closeModal(); baixarICS(guardaId, de, ate);
}

  state.feriados.push({ data, nome }); save(); closeModal(); render(); toast('Feriado salvo');
}
function removerFeriado(data) { state.feriados = state.feriados.filter(f => f.data !== data); save(); render(); toast('Feriado removido'); }

/* ============================================================
   VIEW: CONFIGURAÇÕES
   ============================================================ */
function viewConfig() {
  $('main').innerHTML = `<div class="space-y-4 max-w-2xl">
    <div class="${CARD} p-4">
      <label class="block text-sm font-medium mb-1">Nome da instituição</label>
      <div class="flex gap-2"><input id="cfg-inst" value="${esc(state.instituicao)}" class="${INPUT}"><button onclick="state.instituicao=$('cfg-inst').value.trim()||'Guarda Municipal';save();render();toast('Salvo')" class="${BTN_P}">Salvar</button></div>
    </div>
    <div class="${CARD} p-4">
      <h3 class="font-semibold mb-1">Regras de efetivo</h3>
      <p class="text-sm text-slate-500 mb-3">Valem para o painel de Efetivo e para os avisos ao registrar afastamentos e trocas de jornada. Central, Defesa Civil, expediente e patrulhas não entram na conta.</p>
      <div class="grid gap-3 md:grid-cols-2">
        <div><label class="block text-sm font-medium mb-1">Diurno: mínimo de agentes (equipe operacional + PPC)</label><input id="rg-dia" type="number" min="0" inputmode="numeric" value="${regrasEfetivo().diurnoMin}" class="${INPUT}"></div>
        <label class="flex items-end gap-2 text-sm pb-3"><input id="rg-sup" type="checkbox" class="w-5 h-5 accent-teal-700" ${regrasEfetivo().exigeSupDiurno ? 'checked' : ''}> Exigir supervisor diurno presente</label>
        <div><label class="block text-sm font-medium mb-1">Noturno: máximo de ausentes na equipe</label><input id="rg-noite" type="number" min="0" inputmode="numeric" value="${regrasEfetivo().noturnoMaxAus}" class="${INPUT}"></div>
        <div><label class="block text-sm font-medium mb-1">ROMU: mínimo por equipe em serviço</label><input id="rg-romu" type="number" min="0" inputmode="numeric" value="${regrasEfetivo().romuMin}" class="${INPUT}"></div>
        <div><label class="block text-sm font-medium mb-1">GTAM: mínimo em serviço (uma dupla = 2)</label><input id="rg-gtam" type="number" min="0" inputmode="numeric" value="${regrasEfetivo().gtamMin}" class="${INPUT}"></div>
      </div>
      <button onclick="salvarRegrasEfetivo()" class="${BTN_P} mt-3">Salvar regras</button>
    </div>
    <div class="${CARD} p-4">
      <h3 class="font-semibold mb-1">Logos e cabeçalho</h3>
      <p class="text-sm text-slate-500 mb-3">Saem no topo do edital e do boletim. Use PNG, JPG ou SVG; fundo transparente fica melhor.</p>
      <div class="grid gap-3 md:grid-cols-2">
        ${[['municipio', 'Município de Pinhais (esquerda)'], ['gm', 'Guarda Municipal (direita)']].map(([k, rot]) => `<div class="border border-slate-200 rounded-lg p-3">
          <div class="text-sm font-medium mb-2">${rot}</div>
          <div class="h-20 flex items-center justify-center bg-slate-50 rounded mb-2">${(state.logos || {})[k] ? `<img src="${(state.logos || {})[k]}" class="max-h-16 max-w-full" alt="">` : '<span class="text-xs text-slate-400">sem logo</span>'}</div>
          <div class="flex gap-2"><label class="${BTN_O} cursor-pointer flex-1 text-center">Escolher imagem<input type="file" accept="image/*" class="hidden" onchange="enviarLogo('${k}',this)"></label>
          ${(state.logos || {})[k] ? `<button onclick="removerLogo('${k}')" class="${BTN} text-red-600 border border-red-200">Remover</button>` : ''}</div></div>`).join('')}
      </div>
      <div class="text-sm font-medium mt-4 mb-1">Linhas do cabeçalho</div>
      <div class="grid gap-2">${[0, 1, 2].map(i => `<input id="cab-${i + 1}" value="${esc((state.cabecalho || [])[i] || '')}" placeholder="${esc(CAB_PADRAO[i])}" class="${INPUT}">`).join('')}</div>
      <button onclick="salvarCabecalho()" class="${BTN_P} mt-3">Salvar cabeçalho</button>
    </div>
    <div class="${CARD} p-4">
      <h3 class="font-semibold mb-1">Assinatura dos documentos</h3>
      <p class="text-sm text-slate-500 mb-3">Sai no rodapé do edital da escala e do boletim diário.</p>
      <div class="grid gap-2 md:grid-cols-3">
        <input id="ass-nome" value="${esc((state.assinatura || {}).nome || '')}" placeholder="Nome" class="${INPUT}">
        <input id="ass-cargo" value="${esc((state.assinatura || {}).cargo || '')}" placeholder="Cargo" class="${INPUT}">
        <input id="ass-cidade" value="${esc((state.assinatura || {}).cidade || '')}" placeholder="Cidade" class="${INPUT}"></div>
      <button onclick="state.assinatura={nome:$('ass-nome').value.trim(),cargo:$('ass-cargo').value.trim(),cidade:$('ass-cidade').value.trim()};save();toast('Assinatura salva')" class="${BTN_P} mt-3">Salvar assinatura</button>
    </div>
    <div class="${CARD} p-4">
      <h3 class="font-semibold mb-1">Feriados</h3>
      <p class="text-sm text-slate-500 mb-3">Nos ciclos com "Folga nos feriados" (expediente), o turno vira folga nestas datas. Inclua também feriados estaduais e municipais.</p>
      ${(state.feriados || []).length ? `<ul class="text-sm mb-3">${[...state.feriados].sort((a, b) => a.data < b.data ? -1 : 1).map(f => `<li class="flex items-center justify-between gap-2 py-2 border-b border-slate-100 last:border-0"><span>${br(f.data)} — ${esc(f.nome || 'Feriado')}</span><button onclick="removerFeriado('${f.data}')" class="tt px-3 rounded-lg text-xs text-red-600 hover:bg-red-50 shrink-0">Remover</button></li>`).join('')}</ul>` : '<p class="text-sm text-slate-400 mb-3">Nenhum feriado cadastrado.</p>'}
      <button onclick="formFeriado()" class="${BTN_O}">+ Adicionar feriado</button>
    </div>
    <div class="${CARD} p-4">
      <h3 class="font-semibold mb-1">Diagnóstico</h3>
      <p class="text-sm text-slate-500 mb-2">Informações úteis para suporte.</p>
      <div class="mb-3">${(() => { let usado = 0; try { for (const k in localStorage) { if (localStorage.hasOwnProperty(k)) usado += (localStorage[k] || '').length; } } catch (e) {} const kb = v => (v / 1024).toFixed(1) + ' KB'; const meta = _lerBackupMeta(); const idade = idadeUltimoBackup(); const linhas = [['Armazenamento usado', kb(usado)], ['Última gravação', state._atualizadoEm ? fmtDataHora(state._atualizadoEm) : '—'], ['Último backup', meta.ultimo ? fmtDataHora(meta.ultimo) : '—'], ['Guardas', state.guardas.length], ['Equipes', state.equipes.length], ['Horas extras', (state.horasExtras || []).length], ['Usuários', (state.usuarios || []).length]]; return '<table class="text-xs w-full">' + linhas.map(([k, v]) => '<tr class="border-b border-slate-100"><td class="py-1 text-slate-600">' + esc(k) + '</td><td class="py-1 text-right font-medium">' + esc(String(v)) + '</td></tr>').join('') + '</table>'; })()}</div>
      <h3 class="font-semibold mb-1">Backup</h3>
      <p class="text-sm text-slate-500 mb-2">Os dados ficam só neste navegador. Exporte com frequência para não perder nada.</p>
      ${(() => { const idade = idadeUltimoBackup(); if (idade === null) return '<div class="text-xs bg-sky-50 border border-sky-200 rounded-lg p-2 mb-2">Ainda não há backup automático. Ele é feito a cada 30 minutos.</div>'; const cor = idade > BACKUP_MAX_IDADE_DIAS ? 'amber' : 'emerald'; return '<div class="text-xs bg-' + cor + '-50 border border-' + cor + '-200 text-' + cor + '-900 rounded-lg p-2 mb-2">Último backup automático: <b>' + (idade === 0 ? 'hoje' : idade === 1 ? 'há 1 dia' : 'há ' + idade + ' dias') + '</b>.</div>'; })()}
      <div class="flex flex-wrap gap-2">
        <button onclick="exportarJSON()" class="${BTN_P}">Exportar JSON</button>
        <button onclick="importarJSON()" class="${BTN_O}">Importar JSON</button>
        <button onclick="confirmar('Restaurar backup','<p>O estado atual será substituído pelo último backup automático.</p>',()=>{restaurarBackup()},'Restaurar',true)" class="${BTN} bg-sky-600 text-white">Restaurar backup</button>
        ${state._backupImport ? `<button onclick="desfazerImportacao()" class="${BTN} bg-amber-500 text-white">Desfazer última importação</button>` : ''}
        <button onclick="confirmar('Resetar dados','<p>Todas as alterações serão apagadas e a base de setembro/2026 será recarregada.</p>',()=>{state=seedState();save();render();toast('Dados resetados')},'Resetar',true)" class="${BTN} bg-red-600 text-white">Resetar dados</button>
      </div>
    </div></div>`;
}
function exportarJSON() {
  openModal('Exportar JSON', `<p class="text-sm text-slate-500 mb-2">Copie o conteúdo e guarde num arquivo ou nota.</p>
    <textarea id="json-out" readonly rows="12" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-mono">${esc(JSON.stringify(state, null, 2))}</textarea>`,
    `<div class="flex gap-2 justify-end"><button onclick="closeModal()" class="${BTN_G}">Fechar</button><button onclick="copiarTexto($('json-out').value).then(ok=>toast(ok?'JSON copiado':'Selecione e copie manualmente',ok?'ok':'error'))" class="${BTN_P}">Copiar</button></div>`);
}
function importarJSON() {
  openModal('Importar JSON', `
    <label class="${BTN_O} flex items-center justify-center cursor-pointer mb-3">Escolher arquivo .json<input type="file" accept=".json,application/json,text/plain" onchange="lerArquivoJSON(event)" class="hidden"></label>
    <textarea id="json-in" rows="8" class="w-full border border-slate-300 rounded-lg p-2 text-xs font-mono" placeholder="Ou cole aqui o JSON exportado"></textarea>
    <p class="text-xs text-slate-500 mt-2">Os dados atuais serão substituídos. Exporte um backup antes se houver algo a guardar.</p>`,
    `<div class="flex gap-2 justify-end"><button onclick="closeModal()" class="${BTN_G}">Cancelar</button><button onclick="processarJSON()" class="${BTN_P}">Importar</button></div>`);
}
function lerArquivoJSON(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => { $('json-in').value = String(e.target.result || ''); toast(`Arquivo "${f.name}" carregado. Toque em Importar.`, 'info'); };
  r.onerror = () => toast('Não foi possível ler o arquivo', 'error');
  r.readAsText(f);
}
function processarJSON() {
  try {
    const obj = JSON.parse($('json-in').value);
    if (!obj || !Array.isArray(obj.guardas) || !Array.isArray(obj.equipes)) throw new Error('faltam as listas de guardas e equipes');
    state = normalizarEstado(obj); save(); closeModal(); render(); toast('Dados importados');
  } catch (e) { toast('JSON inválido: ' + e.message, 'error'); }
}

/* ============================================================
   GESTO DE DESLIZAR (dia anterior/próximo na tela Hoje)
   ============================================================ */
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (view !== 'hoje' || modalAberto()) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) mudarDia(dx < 0 ? 1 : -1);
}, { passive: true });

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
let _ultimaAtividade = Date.now();
['click', 'keydown', 'input', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { _ultimaAtividade = Date.now(); }, { passive: true }));
setInterval(() => {
  if (!sessaoUserId) return;
  if (Date.now() - _ultimaAtividade > SESSAO_TIMEOUT_MS) {
    toast('Sessão expirada por inatividade', 'warn');
    supSair();
  }
}, 60 * 1000);

window.addEventListener('storage', ev => {
  if (ev.key !== STORAGE_KEY || !ev.newValue) return;
  try {
    const outro = JSON.parse(ev.newValue);
    if (JSON.stringify(outro) === JSON.stringify(state)) return;
    if (modalAberto()) { toast('Dados alterados em outra aba. Feche e recarregue para não sobrescrever.', 'warn'); return; }
    confirmar('Dados alterados em outra aba', '<p>O app foi alterado em outra aba. Deseja recarregar para ver as mudanças?</p>', () => {
      state = normalizarEstado(outro);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      render(); toast('Dados recarregados');
    }, 'Recarregar');
  } catch (e) {}
});

save();
render();
let lastMobile = isMobile(), rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (isMobile() !== lastMobile) { lastMobile = isMobile(); if (!modalAberto()) render(); } }, 200); });
</script>
</body>
</html>
